# DefaultStackr managed application router
map $host $ds_app_upstream {
    default "";
    include /etc/nginx/defaultstackr-apps/routes.map;
}
map $http_upgrade $ds_upgrade {
    default upgrade;
    "" close;
}
map $uri $ds_health_request {
    default false;
    /healthz true;
}
log_format ds_apps escape=json '{"time":"$time_iso8601","host":"$host","status":$status,"duration":$request_time,"health":$ds_health_request}';
server {
    listen 127.0.0.1:8088;
    server_name *.defaultstackr.cloud;
    server_tokens off;
    access_log /var/log/nginx/defaultstackr-apps.jsonl ds_apps;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-DefaultStack-Route $host always;
    location / {
        if ($ds_app_upstream = "") { return 404; }
        proxy_pass http://$ds_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ds_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
