# Directe modus (MODE=direct): publiek op poort 80 en 443.
# De thuisserver gebruikt tunnel.conf (MODE=tunnel) en laadt dit bestand niet.
#
# defaultstack.online            -> 301 https://www.defaultstack.online
# www.defaultstack.online        -> Next.js on 127.0.0.1:3100
# api.defaultstack.online        -> Express on 127.0.0.1:3000
# *.defaultstack.online          -> deploy/nginx/wildcard.conf + subdomains.map
#
# Certificate files are symlinks. deploy/tls/relink-certs.sh points them at
# Let's Encrypt, a Cloudflare origin certificate, or the temporary self-signed pair.

server_tokens off;
map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $host $subdomain_upstream {
    default "";
    include /etc/nginx/defaultstack/subdomains.map;
}

ssl_session_cache shared:DefaultstackSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    server_name defaultstack.online www.defaultstack.online api.defaultstack.online *.defaultstack.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        set $target_host $host;
        if ($host = defaultstack.online) {
            set $target_host www.defaultstack.online;
        }
        return 301 https://$target_host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name defaultstack.online;

    ssl_certificate     /etc/nginx/defaultstack/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/defaultstack/certs/privkey.pem;
    include /etc/nginx/defaultstack/ssl-params.conf;

    return 301 https://www.defaultstack.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.defaultstack.online;

    ssl_certificate     /etc/nginx/defaultstack/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/defaultstack/certs/privkey.pem;
    include /etc/nginx/defaultstack/ssl-params.conf;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/defaultstack/proxy-params.conf;
    }
}

server {
    listen 443 ssl http2;
    server_name api.defaultstack.online;

    ssl_certificate     /etc/nginx/defaultstack/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/defaultstack/certs/privkey.pem;
    include /etc/nginx/defaultstack/ssl-params.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/defaultstack/proxy-params.conf;
    }
}

include /etc/nginx/defaultstack/wildcard.conf;
