# Customer subdomains. www and api are more specific server names, so they
# never land here. Unknown names get the friendly 404 page.
# Add a line to /etc/nginx/defaultstackr/subdomains.map and run nginx -s reload.

server {
    listen 443 ssl http2;
    server_name *.defaultstackr.cloud;

    ssl_certificate     /etc/nginx/defaultstackr/certs/wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/defaultstackr/certs/wildcard/privkey.pem;
    include /etc/nginx/defaultstackr/ssl-params.conf;

    client_max_body_size 25m;
    error_page 404 /unknown-subdomain.html;

    location = /unknown-subdomain.html {
        root /var/www/defaultstackr-errors;
        default_type text/html;
        charset utf-8;
        internal;
    }

    location / {
        if ($subdomain_upstream = "") {
            return 404;
        }
        proxy_pass http://$subdomain_upstream;
        include /etc/nginx/defaultstackr/proxy-params.conf;
    }
}
