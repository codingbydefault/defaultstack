# Directe modus (MODE=direct): publiek op poort 80 en 443.
# De thuisserver gebruikt tunnel.conf (MODE=tunnel) en laadt dit bestand niet.
#
# defaultstackr.cloud            -> 301 https://www.defaultstackr.cloud
# www.defaultstackr.cloud        -> Next.js on 127.0.0.1:3100
# api.defaultstackr.cloud        -> Express on 127.0.0.1:3000
# *.defaultstackr.cloud          -> deploy/nginx/wildcard.conf + subdomains.map
#
# Certificate files are symlinks. deploy/tls/relink-certs.sh points them at
# Let's Encrypt, a Cloudflare origin certificate, or the temporary self-signed pair.

server_tokens off;
map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $host $subdomain_upstream {
    default "";
    include /etc/nginx/defaultstackr/subdomains.map;
}

ssl_session_cache shared:DefaultstackrSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    server_name defaultstackr.cloud www.defaultstackr.cloud api.defaultstackr.cloud *.defaultstackr.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        set $target_host $host;
        if ($host = defaultstackr.cloud) {
            set $target_host www.defaultstackr.cloud;
        }
        return 301 https://$target_host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name defaultstackr.cloud;

    ssl_certificate     /etc/nginx/defaultstackr/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/defaultstackr/certs/privkey.pem;
    include /etc/nginx/defaultstackr/ssl-params.conf;

    return 301 https://www.defaultstackr.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.defaultstackr.cloud;

    ssl_certificate     /etc/nginx/defaultstackr/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/defaultstackr/certs/privkey.pem;
    include /etc/nginx/defaultstackr/ssl-params.conf;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/defaultstackr/proxy-params.conf;
    }
}

server {
    listen 443 ssl http2;
    server_name api.defaultstackr.cloud;

    ssl_certificate     /etc/nginx/defaultstackr/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/defaultstackr/certs/privkey.pem;
    include /etc/nginx/defaultstackr/ssl-params.conf;

    client_max_body_size 25m;

    location / {
        # Proxied to Express on 127.0.0.1:3000 (API-key auth).
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/defaultstackr/proxy-params.conf;
    }
}

include /etc/nginx/defaultstackr/wildcard.conf;
