# Included from each HTTPS server. Do not put ssl_session_cache here:
# a shared zone included by more than one server makes nginx fail.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
server_tokens off;

# No includeSubDomains yet: customer subdomains only get a trusted cert
# after the wildcard certificate exists.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
