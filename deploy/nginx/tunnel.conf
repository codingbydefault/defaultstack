# Tunnel-modus. Alleen cloudflared op deze machine praat met Nginx.
# Luistert uitsluitend op 127.0.0.1:80. Geen certificaat, geen poort 443.
#
# TLS stopt bij Cloudflare. Stuur www, api en andere namen NIET door naar
# https op basis van $scheme, anders ontstaat een lus.
# Alleen de apex gaat met 301 naar https://www.defaultstackr.online.
#
# defaultstackr.online            -> 301 https://www.defaultstackr.online
# www.defaultstackr.online        -> Next.js op 127.0.0.1:3100
# api.defaultstackr.online        -> Express op 127.0.0.1:3000
# *.defaultstackr.online          -> subdomains.map, anders de 404-pagina

server_tokens off;
map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $host $subdomain_upstream {
    default "";
    include /etc/nginx/defaultstackr/subdomains.map;
}

# Alleen verkeer van cloudflared (localhost) mag CF-Connecting-IP zetten.
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

server {
    listen 127.0.0.1:80;
    server_name defaultstackr.online;
    return 301 https://www.defaultstackr.online$request_uri;
}

server {
    listen 127.0.0.1:80;
    server_name www.defaultstackr.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/defaultstackr/proxy-params-tunnel.conf;
    }
}

server {
    listen 127.0.0.1:80;
    server_name api.defaultstackr.online;

    client_max_body_size 25m;

    location / {
        # Express has no authentication yet. Keep it private.
        return 404;
    }
}

server {
    listen 127.0.0.1:80;
    server_name *.defaultstackr.online;

    client_max_body_size 25m;
    error_page 404 /unknown-subdomain.html;

    location = /unknown-subdomain.html {
        root /var/www/defaultstackr-errors;
        default_type text/html;
        charset utf-8;
        internal;
    }

    location / {
        if ($subdomain_upstream = "") {
            return 404;
        }
        proxy_pass http://$subdomain_upstream;
        include /etc/nginx/defaultstackr/proxy-params-tunnel.conf;
    }
}
