<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Subdomain not set up — DefaultStackr</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070b1b;
      color: #edf3ff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(560px, calc(100% - 40px));
      padding: 36px 32px;
      border: 1px solid #44578070;
      border-radius: 16px;
      background: #111b35;
    }
    p { color: #a7b3ce; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 8px;
      color: #8bb2ff;
      font-weight: 700;
    }
    .code { color: #6795ff; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This subdomain is not set up.</h1>
    <p>Dit subdomein bestaat nog niet. Nothing is linked to this name yet.</p>
    <p><a href="https://www.defaultstackr.cloud">Go to www.defaultstackr.cloud</a></p>
  </main>
</body>
</html>
